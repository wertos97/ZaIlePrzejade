<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Image Editor - Za Ile Przejadę?</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; }
    
    .app { display: flex; height: 100vh; }
    
    /* Left panel - controls */
    .panel {
      width: 340px;
      min-width: 340px;
      background: #16213e;
      overflow-y: auto;
      padding: 16px;
      border-right: 2px solid #0f3460;
    }
    .panel h2 { font-size: 16px; color: #5dade2; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #0f3460; }
    .panel h3 { font-size: 13px; color: #aaa; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 1px; }
    
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; color: #999; margin-bottom: 3px; }
    .field input[type="text"], .field input[type="number"], .field select {
      width: 100%; padding: 6px 10px; background: #0d1b2a; border: 1px solid #1b2838;
      color: #fff; border-radius: 4px; font-size: 14px;
    }
    .field input[type="range"] { width: 100%; }
    .field input[type="color"] { width: 40px; height: 28px; border: none; cursor: pointer; }
    .field-row { display: flex; gap: 8px; align-items: center; }
    .field-row .field { flex: 1; margin-bottom: 0; }
    .field .val { font-size: 12px; color: #5dade2; min-width: 36px; text-align: right; }
    
    .btn {
      padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;
      font-size: 13px; font-weight: 600; transition: all 0.2s;
    }
    .btn-primary { background: #5dade2; color: #fff; }
    .btn-primary:hover { background: #3498db; }
    .btn-secondary { background: #2c3e50; color: #aaa; }
    .btn-secondary:hover { background: #34495e; color: #fff; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-success:hover { background: #219a52; }
    .btn-danger { background: #c0392b; color: #fff; }
    .btn-danger:hover { background: #a93226; }
    .btn-group { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    
    /* Center - preview */
    .center-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0d1117;
      overflow: auto;
      position: relative;
    }
    .preview-label {
      font-size: 12px; color: #666; margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 1px;
      display: flex; align-items: center; gap: 12px;
    }
    .zoom-controls {
      display: flex; align-items: center; gap: 6px;
    }
    .zoom-controls button {
      width: 28px; height: 28px; border: 1px solid #333; background: #1a1a2e;
      color: #aaa; border-radius: 4px; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .zoom-controls button:hover { background: #333; color: #fff; }
    .zoom-controls span { font-size: 13px; color: #5dade2; min-width: 40px; text-align: center; }
    .preview-wrapper {
      border: 2px solid #333;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      overflow: hidden;
      transition: transform 0.1s;
      transform-origin: center top;
    }
    .preview-wrapper svg { display: block; width: 100%; height: auto; }
    
    .json-output {
      margin-top: 16px;
      width: 100%;
      max-width: 1200px;
    }
    .json-output textarea {
      width: 100%; height: 120px; background: #0d1b2a; color: #5dade2;
      border: 1px solid #1b2838; border-radius: 4px; padding: 10px;
      font-family: 'Fira Code', monospace; font-size: 12px; resize: vertical;
    }
    
    /* Right panel - properties */
    .props-panel {
      width: 340px;
      min-width: 340px;
      background: #16213e;
      overflow-y: auto;
      padding: 16px;
      border-left: 2px solid #0f3460;
    }
    .props-panel h2 { font-size: 16px; color: #5dade2; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #0f3460; }
    .props-empty { color: #666; font-size: 13px; font-style: italic; margin-top: 20px; }
    
    /* Stop name input */
    .stop-inputs { margin-bottom: 16px; }
    .stop-inputs .field { margin-bottom: 8px; }
    
    /* Collapsible sections */
    .section { margin-bottom: 8px; border: 1px solid #1b2838; border-radius: 6px; overflow: hidden; }
    .section-header {
      padding: 10px 12px; background: #0f3460; cursor: pointer;
      font-size: 13px; font-weight: 600; display: flex; justify-content: space-between;
      user-select: none;
    }
    .section-header:hover { background: #1a4a7a; }
    .section-header .arrow { transition: transform 0.2s; }
    .section-header.open .arrow { transform: rotate(90deg); }
    .section-body { padding: 12px; display: none; }
    .section-body.open { display: block; }
    
    /* Elements list */
    .elements-list { margin-bottom: 12px; }
    .element-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; margin-bottom: 4px;
      background: #0d1b2a; border-radius: 4px; cursor: pointer;
      border: 1px solid transparent; font-size: 13px;
    }
    .element-item:hover { border-color: #1b2838; }
    .element-item.selected { border-color: #5dade2; background: #0d2137; }
    .element-item .el-icon { width: 20px; text-align: center; color: #5dade2; }
    .element-item .el-name { flex: 1; }
    .element-item .el-vis { cursor: pointer; color: #666; }
    .element-item .el-vis:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Left Panel: Controls -->
    <div class="panel" id="panel">
      <h2>🎨 OG Image Editor</h2>
      
      <!-- Stop Name Inputs -->
      <div class="stop-inputs">
        <div class="field">
          <label>Przystanek SKĄD</label>
          <input type="text" id="fromName" value="Szpital Uniwersytecki / Instytut Pediatrii" oninput="render()">
        </div>
        <div class="field">
          <label>Przystanek DOKĄD</label>
          <input type="text" id="toName" value="Plac Centralny im. R. Reagana" oninput="render()">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Cena regularna</label>
            <input type="number" id="costRegular" value="9.00" step="0.50" oninput="render()">
          </div>
          <div class="field">
            <label>Cena ulgowa</label>
            <input type="number" id="costReduced" value="4.50" step="0.25" oninput="render()">
          </div>
          <div class="field">
            <label>Pokaż cenę</label>
            <select id="showCost" onchange="render()">
              <option value="regular">Regularna</option>
              <option value="reduced">Ulga</option>
              <option value="both">Obie</option>
              <option value="none">Ukryj</option>
            </select>
          </div>
        </div>
      </div>
      
      <!-- Elements List -->
      <h3>Elementy</h3>
      <div class="elements-list" id="elementsList"></div>
      
      <!-- Canvas Settings -->
      <div class="section">
        <div class="section-header open" onclick="toggleSection(this)">
          <span>📐 Płótno</span><span class="arrow">▶</span>
        </div>
        <div class="section-body open">
          <div class="field-row">
            <div class="field"><label>Szerokość</label><input type="number" id="canvasWidth" value="1200" oninput="render()"></div>
            <div class="field"><label>Wyskość</label><input type="number" id="canvasHeight" value="630" oninput="render()"></div>
          </div>
          <div class="field">
            <label>Tło - kolor górny</label>
            <div class="field-row">
              <input type="text" id="bgTop" value="#0d2137" oninput="config.background.colorTop=this.value; render()">
              <input type="color" id="bgTopColor" value="#0d2137" oninput="document.getElementById('bgTop').value=this.value; config.background.colorTop=this.value; render()">
            </div>
          </div>
          <div class="field">
            <label>Tło - kolor dolny</label>
            <div class="field-row">
              <input type="text" id="bgBottom" value="#1a3a52" oninput="config.background.colorBottom=this.value; render()">
              <input type="color" id="bgBottomColor" value="#1a3a52" oninput="document.getElementById('bgBottom').value=this.value; config.background.colorBottom=this.value; render()">
            </div>
          </div>
        </div>
      </div>
      
      <!-- Buttons -->
      <div class="btn-group">
        <button class="btn btn-primary" onclick="exportSVG()">📋 Eksportuj SVG</button>
        <button class="btn btn-success" onclick="exportPython()">🐍 Eksportuj Python</button>
        <button class="btn btn-secondary" onclick="saveConfig()">💾 Zapisz</button>
        <button class="btn btn-secondary" onclick="loadConfig()">📂 Wczytaj</button>
      </div>
      
      <!-- Output -->
      <div class="json-output">
        <textarea id="outputArea" readonly placeholder="Wygenerowany kod pojawi się tutaj..."></textarea>
      </div>
    </div>
    
    <!-- Center: Preview -->
    <div class="center-area" id="centerArea">
      <div class="preview-label">
        <span>Podgląd OG Image (1200 × 630)</span>
        <div class="zoom-controls">
          <button onclick="setZoom(zoom - 0.1)" title="Pomniejsz">−</button>
          <span id="zoomLabel">100%</span>
          <button onclick="setZoom(zoom + 0.1)" title="Powiększ">+</button>
          <button onclick="setZoom(1)" title="Reset" style="font-size:11px; width:auto; padding:0 8px;">Reset</button>
        </div>
      </div>
      <div class="preview-wrapper" id="previewWrapper"></div>
    </div>
    
    <!-- Right Panel: Properties -->
    <div class="props-panel" id="propsPanel">
      <h2>⚙️ Właściwości</h2>
      <div id="propsContent">
        <p class="props-empty">Kliknij element na liście po lewej stronie, aby edytować jego właściwości.</p>
      </div>
    </div>
  </div>

  <script>
  // ============================================================
  // Element definitions
  // ============================================================
  const defaultConfig = {
    canvas: { width: 1200, height: 630 },
    background: {
      colorTop: '#0d2137',
      colorBottom: '#1a3a52',
    },
    elements: [
      {
        id: 'fromLabel',
        type: 'text',
        label: 'SKĄD (etykieta)',
        visible: true,
        x: 80, y: 70,
        text: 'SKĄD',
        fontFamily: 'Arial, Helvetica, sans-serif',
        fontSize: 32, fontWeight: 'bold',
        fill: '#5dade2',
        opacity: 1,
      },
      {
        id: 'fromName',
        type: 'dynamicText',
        label: 'SKĄD (nazwa)',
        visible: true,
        x: 80, y: 0,
        source: 'fromName',
        fontFamily: 'Arial, Helvetica, sans-serif',
        fontSize: 72, fontWeight: 'bold',
        fill: '#ecf0f1',
        opacity: 1,
        autoY: 'fromLabel',
        autoYGap: 30,
      },
      {
        id: 'toLabel',
        type: 'text',
        label: 'DOKĄD (etykieta)',
        visible: true,
        x: 80, y: 0,
        text: 'DOKĄD',
        fontFamily: 'Arial, Helvetica, sans-serif',
        fontSize: 32, fontWeight: 'bold',
        fill: '#5dade2',
        opacity: 1,
        autoY: 'fromName',
        autoYGap: 50,
      },
      {
        id: 'toName',
        type: 'dynamicText',
        label: 'DOKĄD (nazwa)',
        visible: true,
        x: 80, y: 0,
        source: 'toName',
        fontFamily: 'Arial, Helvetica, sans-serif',
        fontSize: 72, fontWeight: 'bold',
        fill: '#ecf0f1',
        opacity: 1,
        autoY: 'toLabel',
        autoYGap: 30,
      },
      {
        id: 'separator',
        type: 'line',
        label: 'Separator',
        visible: true,
        x1: 80, y1: 0, x2: 240, y2: 0,
        stroke: '#5dade2', strokeWidth: 4, opacity: 1,
        autoY: 'toName',
        autoYGap: 40,
      },
      {
        id: 'costLabel',
        type: 'text',
        label: 'CENA BILETU (etykieta)',
        visible: true,
        x: 80, y: 0,
        text: 'CENA BILETU',
        fontFamily: 'Arial, Helvetica, sans-serif',
        fontSize: 32, fontWeight: 'normal',
        fill: '#5dade2', opacity: 1,
        autoY: 'separator',
        autoYGap: 30,
      },
      {
        id: 'costValue',
        type: 'dynamicText',
        label: 'CENA (wartość)',
        visible: true,
        x: 80, y: 0,
        source: 'cost',
        fontFamily: 'Arial, Helvetica, sans-serif',
        fontSize: 120, fontWeight: 'bold',
        fill: '#ffffff', opacity: 1,
        autoY: 'costLabel',
        autoYGap: 30,
      },
      {
        id: 'busBody',
        type: 'rect',
        label: 'Autobus (karoseria)',
        visible: true,
        x: 920, y: 420,
        width: 180, height: 96, rx: 16,
        fill: '#2874a6', opacity: 1,
      },
      {
        id: 'busWin1',
        type: 'rect',
        label: 'Autobus (okno 1)',
        visible: true,
        x: 938, y: 438,
        width: 28, height: 28, rx: 4,
        fill: '#aed6f1', opacity: 1,
      },
      {
        id: 'busWin2',
        type: 'rect',
        label: 'Autobus (okno 2)',
        visible: true,
        x: 996, y: 438,
        width: 28, height: 28, rx: 4,
        fill: '#aed6f1', opacity: 1,
      },
      {
        id: 'busWin3',
        type: 'rect',
        label: 'Autobus (okno 3)',
        visible: true,
        x: 1054, y: 438,
        width: 28, height: 28, rx: 4,
        fill: '#aed6f1', opacity: 1,
      },
      {
        id: 'busWheel1',
        type: 'circle',
        label: 'Autobus (koło 1)',
        visible: true,
        cx: 960, cy: 508, r: 16,
        fill: '#2c3e50', opacity: 1,
      },
      {
        id: 'busWheel2',
        type: 'circle',
        label: 'Autobus (koło 2)',
        visible: true,
        cx: 1060, cy: 508, r: 16,
        fill: '#2c3e50', opacity: 1,
      },
      {
        id: 'website',
        type: 'text',
        label: 'Strona internetowa',
        visible: true,
        x: 1010, y: 560,
        text: 'zaileprzeja.de',
        fontFamily: 'Arial, Helvetica, sans-serif',
        fontSize: 24, fontWeight: 'bold',
        fill: '#7f8c8d', opacity: 1,
        textAnchor: 'middle',
      },
    ],
  };

  let config = JSON.parse(JSON.stringify(defaultConfig));
  let selectedElement = null;
  let zoom = 1;

  // ============================================================
  // Zoom
  // ============================================================
  function setZoom(z) {
    zoom = Math.max(0.3, Math.min(3, z));
    document.getElementById('previewWrapper').style.transform = `scale(${zoom})`;
    document.getElementById('zoomLabel').textContent = Math.round(zoom * 100) + '%';
  }

  // ============================================================
  // Compute auto-Y positions
  // ============================================================
  function computePositions() {
    const elems = {};
    config.elements.forEach(e => { elems[e.id] = e; });
    
    config.elements.forEach(e => {
      if (e.autoY && elems[e.autoY]) {
        const ref = elems[e.autoY];
        let refFontSize = ref.fontSize || 0;
        e.y = (ref.y || 0) + refFontSize + (e.autoYGap || 20);
      }
      if (e.type === 'line' && e.autoY) {
        e.y2 = e.y1 = e.y;
      }
    });
  }

  // ============================================================
  // Render SVG
  // ============================================================
  function render() {
    computePositions();
    
    const W = parseInt(document.getElementById('canvasWidth').value) || 1200;
    const H = parseInt(document.getElementById('canvasHeight').value) || 630;
    config.canvas.width = W;
    config.canvas.height = H;
    
    const fromNameText = document.getElementById('fromName').value;
    const toNameText = document.getElementById('toName').value;
    const costRegular = parseFloat(document.getElementById('costRegular').value) || 0;
    const costReduced = parseFloat(document.getElementById('costReduced').value) || 0;
    const showCost = document.getElementById('showCost').value;
    
    let costText = '';
    if (showCost === 'regular') costText = costRegular.toFixed(2) + ' zł';
    else if (showCost === 'reduced') costText = costReduced.toFixed(2) + ' zł';
    else if (showCost === 'both') costText = costRegular.toFixed(2) + ' / ' + costReduced.toFixed(2) + ' zł';
    
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">\n`;
    svg += `  <defs>\n`;
    svg += `    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">\n`;
    svg += `      <stop offset="0%" stop-color="${config.background.colorTop}"/>\n`;
    svg += `      <stop offset="100%" stop-color="${config.background.colorBottom}"/>\n`;
    svg += `    </linearGradient>\n`;
    svg += `  </defs>\n`;
    svg += `  <rect width="${W}" height="${H}" fill="url(#bg)"/>\n\n`;
    
    config.elements.forEach(e => {
      if (!e.visible) return;
      
      let opacity = e.opacity !== undefined && e.opacity < 1 ? ` opacity="${e.opacity}"` : '';
      
      if (e.type === 'text' || e.type === 'dynamicText') {
        let text = e.type === 'dynamicText' ? getTextValue(e, fromNameText, toNameText, costText) : e.text;
        let fontSize = e.fontSize;
        let anchor = e.textAnchor ? ` text-anchor="${e.textAnchor}"` : '';
        let weight = e.fontWeight ? ` font-weight="${e.fontWeight}"` : '';
        let yPos = e.y + fontSize * 0.85;
        svg += `  <text x="${e.x}" y="${yPos}" font-family="${e.fontFamily}" font-size="${fontSize}"${weight} fill="${e.fill}"${anchor}${opacity}>${escXml(text)}</text>\n`;
      } else if (e.type === 'line') {
        svg += `  <line x1="${e.x1}" y1="${e.y1}" x2="${e.x2}" y2="${e.y2}" stroke="${e.stroke}" stroke-width="${e.strokeWidth}"${opacity}/>\n`;
      } else if (e.type === 'rect') {
        svg += `  <rect x="${e.x}" y="${e.y}" width="${e.width}" height="${e.height}" rx="${e.rx || 0}" fill="${e.fill}"${opacity}/>\n`;
      } else if (e.type === 'circle') {
        svg += `  <circle cx="${e.cx}" cy="${e.cy}" r="${e.r}" fill="${e.fill}"${opacity}/>\n`;
      }
    });
    
    svg += `</svg>`;
    
    document.getElementById('previewWrapper').innerHTML = svg;
    renderElementsList();
    renderProps();
  }
  
  function getTextValue(e, fromName, toName, cost) {
    if (e.source === 'fromName') return fromName;
    if (e.source === 'toName') return toName;
    if (e.source === 'cost') return cost;
    return e.text || '';
  }
  
  function escXml(s) {
    return s.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"');
  }

  // ============================================================
  // Elements List
  // ============================================================
  function renderElementsList() {
    const list = document.getElementById('elementsList');
    list.innerHTML = '';
    config.elements.forEach((e, i) => {
      const div = document.createElement('div');
      div.className = 'element-item' + (selectedElement === i ? ' selected' : '');
      const icon = e.type === 'text' || e.type === 'dynamicText' ? 'T' :
                   e.type === 'line' ? '─' :
                   e.type === 'rect' ? '□' : '○';
      div.innerHTML = `
        <span class="el-icon">${icon}</span>
        <span class="el-name">${e.label}</span>
        <span class="el-vis" onclick="event.stopPropagation(); toggleVisibility(${i})">${e.visible ? '👁' : '🚫'}</span>
      `;
      div.onclick = () => selectElement(i);
      list.appendChild(div);
    });
  }
  
  function toggleVisibility(i) {
    config.elements[i].visible = !config.elements[i].visible;
    render();
  }
  
  function selectElement(i) {
    selectedElement = i;
    render();
  }

  // ============================================================
  // Properties Panel (right side)
  // ============================================================
  function renderProps() {
    const content = document.getElementById('propsContent');
    if (selectedElement === null) {
      content.innerHTML = '<p class="props-empty">Kliknij element na liście po lewej stronie, aby edytować jego właściwości.</p>';
      return;
    }
    const e = config.elements[selectedElement];
    
    let html = '';
    
    // Name
    html += `<div style="font-size:14px; font-weight:600; color:#5dade2; margin-bottom:12px;">${e.label}</div>`;
    
    // Position
    if (e.type === 'text' || e.type === 'dynamicText') {
      html += field('x', 'X', e.x, 'number', 'render()');
      html += field('y', 'Y', e.y, 'number', 'render()', e.autoY ? 'disabled' : '');
      if (e.autoY) html += `<div class="field"><label>Auto-Y od: ${e.autoY}</label></div>`;
      html += field('autoYGap', 'Odstęp auto-Y (px)', e.autoYGap || 0, 'number', 'render()');
    } else if (e.type === 'line') {
      html += field('x1', 'X1', e.x1, 'number', 'render()');
      html += field('y1', 'Y1', e.y1, 'number', 'render()', e.autoY ? 'disabled' : '');
      html += field('x2', 'X2', e.x2, 'number', 'render()');
      html += field('y2', 'Y2', e.y2, 'number', 'render()', e.autoY ? 'disabled' : '');
      html += field('autoYGap', 'Odstęp auto-Y (px)', e.autoYGap || 0, 'number', 'render()');
    } else if (e.type === 'rect') {
      html += field('x', 'X', e.x, 'number', 'render()');
      html += field('y', 'Y', e.y, 'number', 'render()');
      html += field('width', 'Szerokość', e.width, 'number', 'render()');
      html += field('height', 'Wysokość', e.height, 'number', 'render()');
      html += field('rx', 'Zaokrąglenie', e.rx || 0, 'number', 'render()');
    } else if (e.type === 'circle') {
      html += field('cx', 'CX', e.cx, 'number', 'render()');
      html += field('cy', 'CY', e.cy, 'number', 'render()');
      html += field('r', 'Promień', e.r, 'number', 'render()');
    }
    
    // Text properties
    if (e.type === 'text' || e.type === 'dynamicText') {
      html += `<h3 style="margin-top:12px">Typografia</h3>`;
      if (e.type === 'text') {
        html += field('text', 'Tekst', e.text, 'text', 'render()');
      }
      html += field('fontSize', 'Rozmiar czcionki (px)', e.fontSize, 'number', 'render()');
      html += field('fontWeight', 'Grubość', e.fontWeight, 'select', 'render()',
        '<option value="normal"' + (e.fontWeight === 'normal' ? ' selected' : '') + '>Normalna</option>' +
        '<option value="bold"' + (e.fontWeight === 'bold' ? ' selected' : '') + '>Pogrubiona</option>');
      html += field('textAnchor', 'Wyrównanie', e.textAnchor || 'start', 'select', 'render()',
        '<option value="start"' + ((e.textAnchor||'start') === 'start' ? ' selected' : '') + '>Lewo</option>' +
        '<option value="middle"' + (e.textAnchor === 'middle' ? ' selected' : '') + '>Środek</option>' +
        '<option value="end"' + (e.textAnchor === 'end' ? ' selected' : '') + '>Prawo</option>');
      html += field('fontFamily', 'Czcionka', e.fontFamily, 'text', 'render()');
    }
    
    // Colors
    html += `<h3 style="margin-top:12px">Kolory</h3>`;
    if (e.fill !== undefined) {
      html += colorField('fill', 'Kolor wypełnienia', e.fill);
    }
    if (e.stroke !== undefined) {
      html += colorField('stroke', 'Kolor linii', e.stroke);
    }
    if (e.strokeWidth !== undefined) {
      html += field('strokeWidth', 'Grubość linii', e.strokeWidth, 'number', 'render()');
    }
    
    // Opacity
    html += `<h3 style="margin-top:12px">Inne</h3>`;
    html += `<div class="field"><label>Przezroczystość: <span class="val" id="opacityVal">${(e.opacity || 1).toFixed(2)}</span></label>`;
    html += `<input type="range" min="0" max="1" step="0.05" value="${e.opacity || 1}" oninput="config.elements[${selectedElement}].opacity=parseFloat(this.value); document.getElementById('opacityVal').textContent=this.value; render()"></div>`;
    
    // Move buttons
    html += `<div class="btn-group">
      <button class="btn btn-secondary" onclick="moveElement(${selectedElement}, -10, 0)">← 10</button>
      <button class="btn btn-secondary" onclick="moveElement(${selectedElement}, 10, 0)">→ 10</button>
      <button class="btn btn-secondary" onclick="moveElement(${selectedElement}, 0, -10)">↑ 10</button>
      <button class="btn btn-secondary" onclick="moveElement(${selectedElement}, 0, 10)">↓ 10</button>
      <button class="btn btn-danger" onclick="removeElement(${selectedElement})" style="margin-left:auto">🗑 Usuń</button>
    </div>`;
    
    // Duplicate button
    html += `<div class="btn-group">
      <button class="btn btn-secondary" onclick="duplicateElement(${selectedElement})">📋 Duplikuj</button>
      <button class="btn btn-secondary" onclick="moveUp(${selectedElement})">⬆ Wyżej</button>
      <button class="btn btn-secondary" onclick="moveDown(${selectedElement})">⬇ Niżej</button>
    </div>`;
    
    content.innerHTML = html;
  }
  
  function field(name, label, value, type, oninput, extra) {
    if (type === 'select') {
      return `<div class="field"><label>${label}</label><select onchange="${oninput}" id="prop_${name}">${extra}</select></div>`;
    }
    return `<div class="field"><label>${label}</label><input type="${type}" id="prop_${name}" value="${value}" oninput="config.elements[${selectedElement}].${name}=parseFloat(this.value); ${oninput}" ${extra || ''}></div>`;
  }
  
  function colorField(name, label, value) {
    return `<div class="field"><label>${label}</label><div class="field-row"><input type="text" value="${value}" oninput="config.elements[${selectedElement}].${name}=this.value; render()"><input type="color" value="${value}" oninput="config.elements[${selectedElement}].${name}=this.value; this.previousElementSibling.value=this.value; render()"></div></div>`;
  }
  
  function moveElement(i, dx, dy) {
    const e = config.elements[i];
    if (e.autoY) { e.autoY = null; }
    if (e.type === 'rect') { e.x += dx; e.y += dy; }
    else if (e.type === 'circle') { e.cx += dx; e.cy += dy; }
    else if (e.type === 'line') { e.x1 += dx; e.y1 += dy; e.x2 += dx; e.y2 += dy; }
    else { e.x += dx; e.y += dy; }
    render();
  }
  
  function removeElement(i) {
    if (confirm('Usunąć element ' + config.elements[i].label + '?')) {
      config.elements.splice(i, 1);
      selectedElement = null;
      render();
    }
  }
  
  function duplicateElement(i) {
    const clone = JSON.parse(JSON.stringify(config.elements[i]));
    clone.id = clone.id + '_copy';
    clone.label = clone.label + ' (kopia)';
    if (clone.autoY) clone.autoY = null;
    config.elements.splice(i + 1, 0, clone);
    selectedElement = i + 1;
    render();
  }
  
  function moveUp(i) {
    if (i <= 0) return;
    [config.elements[i-1], config.elements[i]] = [config.elements[i], config.elements[i-1]];
    selectedElement = i - 1;
    render();
  }
  
  function moveDown(i) {
    if (i >= config.elements.length - 1) return;
    [config.elements[i], config.elements[i+1]] = [config.elements[i+1], config.elements[i]];
    selectedElement = i + 1;
    render();
  }

  // ============================================================
  // Section toggle
  // ============================================================
  function toggleSection(header) {
    header.classList.toggle('open');
    header.nextElementSibling.classList.toggle('open');
  }

  // ============================================================
  // Export
  // ============================================================
  function exportSVG() {
    document.getElementById('outputArea').value = document.getElementById('previewWrapper').innerHTML;
    document.getElementById('outputArea').select();
  }
  
  function exportPython() {
    const svg = document.getElementById('previewWrapper').innerHTML;
    const pyCode = `# Wygenerowany przez OG Image Editor - ${new Date().toISOString()}
# Wklej jako ciało metody generate_og_image_svg()

from_name_esc = esc(from_name)
to_name_esc = esc(to_name)
cost_text_esc = esc(cost_text)

svg = f'''${svg.replace(/\$/g, '$$')}'''
`;
    document.getElementById('outputArea').value = pyCode;
    document.getElementById('outputArea').select();
  }
  
  function saveConfig() {
    const json = JSON.stringify(config, null, 2);
    localStorage.setItem('ogEditorConfig', json);
    const blob = new Blob([json], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'og-image-config.json';
    a.click();
  }
  
  function loadConfig() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          config = JSON.parse(ev.target.result);
          // Update form fields
          document.getElementById('canvasWidth').value = config.canvas.width;
          document.getElementById('canvasHeight').value = config.canvas.height;
          document.getElementById('bgTop').value = config.background.colorTop;
          document.getElementById('bgTopColor').value = config.background.colorTop;
          document.getElementById('bgBottom').value = config.background.colorBottom;
          document.getElementById('bgBottomColor').value = config.background.colorBottom;
          render();
        } catch(err) {
          alert('Błąd wczytywania: ' + err.message);
        }
      };
      reader.readAsText(e.target.files[0]);
    };
    input.click();
  }

  // ============================================================
  // Keyboard shortcuts
  // ============================================================
  document.addEventListener('keydown', (e) => {
    if (selectedElement === null) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    
    const step = e.shiftKey ? 1 : 10;
    if (e.key === 'ArrowLeft') { e.preventDefault(); moveElement(selectedElement, -step, 0); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); moveElement(selectedElement, step, 0); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveElement(selectedElement, 0, -step); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); moveElement(selectedElement, 0, step); }
    else if (e.key === 'Delete') { removeElement(selectedElement); }
  });

  // ============================================================
  // Init
  // ============================================================
  const saved = localStorage.getItem('ogEditorConfig');
  if (saved) {
    try { config = JSON.parse(saved); } catch(e) {}
  }
  render();
  </script>
</body>
</html>
