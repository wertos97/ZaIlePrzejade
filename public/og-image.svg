<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a5276"/>
  <!-- Bus icon - centered, above text -->
  <g transform="translate(530, 60) scale(2.5)">
    <!-- Bus body -->
    <rect x="8" y="14" width="48" height="30" rx="6" fill="#2874a6"/>
    <!-- Windows -->
    <rect x="13" y="19" width="10" height="10" rx="2" fill="#aed6f1"/>
    <rect x="27" y="19" width="10" height="10" rx="2" fill="#aed6f1"/>
    <rect x="41" y="19" width="10" height="10" rx="2" fill="#aed6f1"/>
    <!-- Door -->
    <rect x="13" y="33" width="8" height="8" rx="1" fill="#1a5276"/>
    <!-- Wheels -->
    <circle cx="20" cy="48" r="5" fill="#2c3e50"/>
    <circle cx="20" cy="48" r="2" fill="#95a5a6"/>
    <circle cx="44" cy="48" r="5" fill="#2c3e50"/>
    <circle cx="44" cy="48" r="2" fill="#95a5a6"/>
    <!-- Headlights -->
    <circle cx="11" cy="38" r="2" fill="#f1c40f"/>
    <circle cx="53" cy="38" r="2" fill="#e74c3c"/>
    <!-- Roof line -->
    <rect x="8" y="14" width="48" height="3" rx="2" fill="#1a5276"/>
  </g>
  <!-- Title -->
  <text x="600" y="320" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle">Za Ile Przejadę?</text>
  <!-- Subtitle -->
  <text x="600" y="380" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#aed6f1" text-anchor="middle">Kalkulator cen biletów MPK Kraków 2027</text>
  <!-- Description -->
  <text x="600" y="430" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#85c1e9" text-anchor="middle">Oblicz ile zapłacisz za bilet w nowym systemie</text>
  <!-- URL -->
  <text x="600" y="560" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#5dade2" text-anchor="middle">zaileprzeja.de</text>
</svg>